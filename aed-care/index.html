<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="AED Care - 통합 자동심장충격기 관리·안내 플랫폼" />
<title>AED Care · 자동심장충격기 관리·안내 플랫폼</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e3342f'/%3E%3Cpath d='M32 49S12 38 12 24c0-12 15-15 20-5 5-10 20-7 20 5 0 14-20 25-20 25z' fill='white'/%3E%3C/svg%3E">

<!-- Leaflet 1.9.4를 로컬 제공해 CDN 차단 환경에서도 지도를 실행합니다. -->
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<script src="vendor/leaflet/leaflet.js"></script>

<style>
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface-2:#f7f9fd; --line:#e4e9f2; --line-soft:#eef2f8;
  --text:#18212f; --text-2:#48566b; --muted:#7a879e; --faint:#9aa6bb;
  --brand:#e3342f; --brand-2:#c81e1a; --accent:#2f6bff; --accent-2:#1f5be0;
  --ok:#14a86a; --ok-bg:rgba(20,168,106,.10); --ok-line:rgba(20,168,106,.28);
  --warn:#d98a00; --warn-bg:rgba(217,138,0,.10); --warn-line:rgba(217,138,0,.30);
  --danger:#e23b53; --danger-bg:rgba(226,59,83,.10); --danger-line:rgba(226,59,83,.30);
  --r-sm:9px; --r:13px; --r-lg:18px; --r-xl:24px;
  --shadow:0 18px 44px rgba(24,33,47,.14); --shadow-sm:0 4px 16px rgba(24,33,47,.08);
  --ease:.2s cubic-bezier(.4,0,.2,1); --topbar:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Pretendard","Malgun Gothic",system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img{max-width:100%}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cdd6e4;border-radius:8px}
.hidden{display:none!important}
.mono{font-family:"JetBrains Mono",Consolas,monospace}
.muted{color:var(--muted)}

/* ---------- primitives ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.02em;
  padding:4px 10px;border-radius:100px;border:1px solid transparent;white-space:nowrap}
.badge.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.badge.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.badge.danger{color:var(--danger);background:var(--danger-bg);border-color:var(--danger-line)}
.badge.info{color:var(--accent);background:rgba(47,107,255,.10);border-color:rgba(47,107,255,.26)}
.badge.neutral{color:var(--muted);background:var(--surface-2);border-color:var(--line)}
.badge.stopped{color:var(--muted);background:var(--surface-2);border-color:var(--line)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.danger{background:var(--danger)}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:10px;
  padding:9px 14px;font-size:13px;font-weight:600;transition:var(--ease);display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.solid{background:linear-gradient(120deg,var(--brand-2),var(--brand));color:#fff;border-color:transparent}
.btn.solid:hover{filter:brightness(1.05);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.block{width:100%;justify-content:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card.pad{padding:18px}
.grid{display:grid;gap:14px}

/* ---------- top bar ---------- */
.topbar{height:var(--topbar);position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:0 20px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}
.brand-mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:18px;
  background:linear-gradient(135deg,var(--brand-2),var(--brand));box-shadow:0 6px 18px rgba(226,59,83,.35)}
.brand b{font-size:16px;line-height:1.05;display:block}
.brand small{font-size:9px;color:var(--muted);letter-spacing:.14em;display:block}
.tabs{display:flex;gap:4px;margin-left:10px;overflow-x:auto;scrollbar-width:thin;white-space:nowrap}
.tab{padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text-2);transition:var(--ease);display:flex;align-items:center;gap:7px}
.tab:hover{background:var(--surface-2)}
.tab.active{color:var(--brand);background:rgba(226,59,83,.08);font-weight:700}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.mode-chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:100px;padding:6px 12px;font-size:12px;font-weight:600}
.mode-switch{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:100px;padding:3px}
.ms-btn{padding:7px 14px;border-radius:100px;font-size:12.5px;font-weight:700;color:var(--muted);transition:var(--ease)}
.ms-btn:hover{color:var(--text)}
.ms-btn.active{background:var(--surface);color:var(--brand);box-shadow:var(--shadow-sm)}

.wrap{max-width:1500px;margin:0 auto;padding:22px 20px 60px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:24px;letter-spacing:-.035em}
.page-head p{color:var(--muted);font-size:13px;margin-top:4px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- kpi ---------- */
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{padding:16px;position:relative;overflow:hidden}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:600}
.kpi .k-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px}
.kpi .k-val{font-size:30px;font-weight:800;letter-spacing:-.04em;margin-top:10px}
.kpi .k-val small{font-size:13px;color:var(--muted);font-weight:600}
.kpi .k-foot{font-size:11px;color:var(--muted);margin-top:4px}

/* ---------- map layout ---------- */
.map-layout{display:grid;grid-template-columns:360px 1fr;gap:14px;align-items:stretch;height:calc(100vh - var(--topbar) - 120px);min-height:520px}
.map-stage{position:relative;min-width:0;min-height:520px;border-radius:var(--r-lg);overflow:hidden;background:#e9eef5}
#map{width:100%;height:100%;min-height:520px;border-radius:var(--r-lg);border:1px solid var(--line);z-index:1;background:
  linear-gradient(rgba(72,86,107,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(72,86,107,.08) 1px,transparent 1px),#eef3f8;background-size:48px 48px}
.map-status-notice{position:absolute;left:12px;right:12px;bottom:12px;z-index:500;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);box-shadow:var(--shadow-sm);font-size:11px;color:var(--text-2);pointer-events:none}
#dbItems{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.db-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:800;color:var(--text);margin-bottom:8px}.db-head span{font-size:11px;font-weight:700;color:#0f8b8d;background:rgba(15,139,141,.1);border-radius:999px;padding:2px 8px}
.db-note{font-size:12px;color:var(--muted);line-height:1.5;padding:6px 2px}.db-item{border-left:3px solid #0f8b8d}
.db-cluster{border-radius:50%;background:rgba(15,139,141,.88);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;border:3px solid rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(24,33,47,.28);cursor:pointer;white-space:nowrap}
.db-cluster:hover{background:#0b6f71}
.db-sido{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.db-sido-btn{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:12px;color:var(--text);text-align:left}
.db-sido-btn:hover{border-color:#0f8b8d;background:rgba(15,139,141,.06)}.db-sido-btn span{color:#0f8b8d;font-weight:700;white-space:nowrap}
.map-status-notice.ok{border-color:var(--ok-line);color:var(--ok)}.map-status-notice.warn{border-color:var(--warn-line);color:var(--warn)}.map-status-notice.danger{border-color:var(--danger-line);color:var(--danger)}
.static-map{position:relative;width:100%;height:100%;min-height:520px;overflow:hidden;background:radial-gradient(circle at 70% 18%,rgba(47,107,255,.12),transparent 30%),linear-gradient(rgba(72,86,107,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(72,86,107,.10) 1px,transparent 1px),#eaf0f6;background-size:auto,52px 52px,52px 52px,auto}
.static-map:before{content:"대한민국 좌표 기반 오프라인 지도";position:absolute;left:18px;top:16px;color:var(--muted);font-size:12px;font-weight:700}
.static-map-marker{position:absolute;width:20px;height:20px;border-radius:50% 50% 50% 0;transform:translate(-50%,-100%) rotate(-45deg);border:2px solid #fff;box-shadow:0 3px 10px rgba(24,33,47,.3);cursor:pointer}
.static-map-marker span{display:block;transform:rotate(45deg);color:#fff;text-align:center;font-size:10px;line-height:16px}.static-map-marker.active{outline:4px solid rgba(47,107,255,.28)}
.static-map-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.static-map-empty b{display:block;color:var(--text);font-size:15px;margin-bottom:5px}
.aed-list{overflow-y:auto;padding-right:4px;display:flex;flex-direction:column;gap:10px}
.search-row{display:flex;gap:8px;margin-bottom:4px}
.search-row input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);outline:none}
.search-row input:focus{border-color:var(--accent)}
.aed-item{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);cursor:pointer;transition:var(--ease)}
.aed-item:hover{border-color:#c9d4e6;background:var(--surface-2)}
.aed-item.active{border-color:var(--brand);box-shadow:0 0 0 2px rgba(226,59,83,.12)}
.aed-item .ai-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.aed-item strong{font-size:14px}
.aed-item .addr{font-size:12px;color:var(--muted);margin-top:4px}
.aed-item .meta{display:flex;gap:10px;font-size:11px;color:var(--faint);margin-top:7px;flex-wrap:wrap}
.leaflet-popup-content{margin:12px 14px;font-size:13px}
.leaflet-popup-content b{font-size:14px}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;color:#6d7c98;padding:11px;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;white-space:nowrap}
.table td{padding:12px 11px;border-bottom:1px solid var(--line-soft);color:var(--text-2);vertical-align:middle}
.table tbody tr{transition:var(--ease)}
.table tbody tr:hover{background:var(--surface-2)}
.rank{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font-size:12px;font-weight:800;color:#fff;background:var(--muted)}
.rank.danger{background:var(--danger)} .rank.warn{background:var(--warn)} .rank.ok{background:var(--ok)}

/* ---------- form ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.control{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:11px 12px;outline:none;transition:var(--ease)}
.control:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,255,.12)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.form-grid .wide{grid-column:1/-1}

/* ---------- learn (사용법 학습) ---------- */
.learn-stage{max-width:620px;margin:0 auto}
.learn-progress{display:flex;gap:6px;margin-bottom:18px}
.learn-progress .seg{flex:1;height:6px;border-radius:6px;background:var(--line)}
.learn-progress .seg.on{background:var(--brand)}
.step-card{text-align:center;padding:32px 24px}
.step-ico{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;font-size:42px;
  background:rgba(226,59,83,.08);color:var(--brand)}
.step-card .n{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--brand);text-transform:uppercase}
.step-card h2{font-size:24px;letter-spacing:-.03em;margin:8px 0 10px}
.step-card p{font-size:15px;color:var(--text-2);line-height:1.65}
.step-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.quiz-q{border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;background:var(--surface)}
.quiz-q h3{font-size:16px;margin-bottom:12px}
.quiz-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;transition:var(--ease);background:var(--surface)}
.quiz-opt:hover{border-color:var(--accent)}
.quiz-opt.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.quiz-opt.wrong{border-color:var(--danger);background:var(--danger-bg);color:var(--danger);font-weight:700}
.quiz-opt.disabled{pointer-events:none;opacity:.75}
.quiz-explain{margin-top:10px;padding:11px 13px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;line-height:1.6;color:var(--text-2)}

/* 점검 기록 — 다음 점검일 실시간 자동 계산 미리보기 */
.next-preview{border:1px solid var(--accent);border-radius:12px;padding:13px;margin:4px 0 14px;
  background:linear-gradient(160deg,rgba(47,107,255,.07),rgba(47,107,255,.02))}
.next-preview .np-head{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--accent);margin-bottom:10px}
.next-preview .np-grid{display:grid;grid-template-columns:1fr auto 1.2fr;gap:8px;align-items:center}
.next-preview .np-cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.next-preview .np-cell small{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}
.next-preview .np-cell b{font-size:15px;letter-spacing:-.02em}
.next-preview .np-cell.highlight{border-color:var(--accent);background:rgba(47,107,255,.08);position:relative}
.next-preview .np-cell.np-arrow{background:transparent;border:0;color:var(--accent);font-weight:800;font-size:12px}
.next-preview .np-dday{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;color:#fff;background:var(--accent);border-radius:100px;padding:2px 9px}
.next-preview .np-foot{margin-top:11px;font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
@media(max-width:640px){.next-preview .np-grid{grid-template-columns:1fr;gap:6px}.next-preview .np-cell.np-arrow{padding:2px}}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(24,33,47,.3);z-index:80;opacity:0;pointer-events:none;transition:var(--ease)}
.overlay.show{opacity:1;pointer-events:auto}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);width:min(560px,94vw);z-index:90;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px;
  opacity:0;pointer-events:none;transition:var(--ease);max-height:90vh;overflow-y:auto}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.modal-head h2{font-size:19px;letter-spacing:-.02em}
.toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);z-index:120;background:#18212f;color:#fff;
  border-radius:11px;padding:12px 18px;font-size:13px;opacity:0;pointer-events:none;transition:var(--ease);box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{padding:34px;text-align:center;border:1px dashed #cdd6e4;border-radius:13px;background:var(--surface-2)}
.empty .ic{font-size:30px;opacity:.5}
.empty b{display:block;font-size:14px;margin:8px 0 4px}
.empty p{font-size:12px;color:var(--muted);max-width:420px;margin:0 auto}

/* ---------- 긴급 버튼 ---------- */
.btn.emergency{background:linear-gradient(120deg,var(--danger),#ff5d73);color:#fff;border-color:transparent;font-weight:800;
  animation:epulse 2s infinite}
.btn.emergency:hover{filter:brightness(1.06);color:#fff}
@keyframes epulse{0%,100%{box-shadow:0 0 0 0 rgba(226,59,83,.4)}50%{box-shadow:0 0 0 7px rgba(226,59,83,0)}}

/* ---------- 모델 태그 / 필터 칩 ---------- */
.model-tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;
  color:var(--mc,#7a879e);background:color-mix(in srgb,var(--mc,#7a879e) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--mc,#7a879e) 30%,transparent);white-space:nowrap}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter-chip{border:1px solid var(--line);background:var(--surface);border-radius:100px;padding:7px 13px;font-size:12px;font-weight:600;color:var(--text-2);transition:var(--ease)}
.filter-chip:hover{border-color:var(--mc,var(--accent));color:var(--mc,var(--accent))}
.filter-chip.on{background:var(--mc,var(--brand));border-color:transparent;color:#fff}

/* ---------- 제품(모델)별 요약 카드 ---------- */
.model-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.model-card .mc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.model-card .mc-top strong{font-size:13px}
.model-card .mc-stats{display:flex;gap:10px;font-size:11px;margin-top:10px;font-weight:700}
.model-card .mc-stats .ok{color:var(--ok)} .model-card .mc-stats .warn{color:var(--warn)} .model-card .mc-stats .danger{color:var(--danger)}

/* ---------- 제품 사용법 그리드 ---------- */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.product-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;text-align:left;transition:var(--ease);box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.product-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#c9d4e6}
.product-card .pc-img{padding:16px;display:grid;place-items:center}
.product-card .pc-body{padding:14px 16px 18px}
.product-card .pc-tag{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:100px;margin-bottom:8px}
.product-card .pc-body strong{display:block;font-size:16px;letter-spacing:-.02em}
.product-card .pc-body p{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-card .pc-more{display:inline-block;font-size:12px;font-weight:700;margin-top:10px}
.feat-row{display:flex;flex-wrap:wrap;gap:6px}
.feat{font-size:11px;font-weight:600;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);border-radius:100px;padding:5px 10px}
.prod-steps{list-style:none;counter-reset:s;display:grid;gap:9px;margin-top:4px}
.prod-steps li{counter-increment:s;position:relative;padding:11px 12px 11px 42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;color:var(--text-2)}
.prod-steps li:before{content:counter(s);position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}

/* ---------- 조치 가이드 ---------- */

/* ---------- 홈 · 필터 · 상세 · 복구 ---------- */

<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">♥</span>
    <span><b>AED Care</b><small>자동심장충격기 관리·안내</small></span>
  </div>

    <button class="btn sm top-export hidden" id="topCsvExport" type="button" title="전체 기기 현황 CSV 내보내기">⬇ CSV 내보내기</button>
    <div class="mode-switch" id="modeSwitch">
      <button class="ms-btn active" data-mode="citizen">🙋 시민용</button>

    <button class="mode-chip" id="infoChip" title="데이터 저장 안내"><span class="dot ok"></span>데모 · 로컬 저장 ⓘ</button>
  </div>
</header>

<main class="wrap" id="view"></main>

<div class="overlay" id="overlay" aria-hidden="true"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="상세 대화상자"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   AED Care — 단일 HTML MVP
   구조 메모(2단계 분리 대비):
   - 모든 데이터 접근은 Store 한 곳에서만. 나중에 localStorage → fetch(백엔드)
     로 바꾸려면 Store 내부 구현만 교체하면 됨.
   - UI는 Views[viewId](host) 형태의 렌더 함수로 분리.
   ============================================================ */

/* ---------- tiny DOM helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=()=>"AED-"+Math.random().toString(36).slice(2,7).toUpperCase();
const todayStr=()=>new Date().toISOString().slice(0,10);
function addDays(dateStr,days){const d=new Date(dateStr);d.setDate(d.getDate()+days);return d.toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2600);}
function openModal(html){const modal=$("#modal"),overlay=$("#overlay");modal.innerHTML=html;overlay.classList.add("show");overlay.setAttribute("aria-hidden","false");modal.classList.add("show");setTimeout(()=>{const target=modal.querySelector("[autofocus],button,input,select,textarea,a[href]");if(target)target.focus();},30);}
function closeModal(){const overlay=$("#overlay");overlay.classList.remove("show");overlay.setAttribute("aria-hidden","true");$("#modal").classList.remove("show");}
window.closeModal=closeModal;

/* ============================================================
   STORE — 데이터 접근 계층 (교체 지점)
   AED 기기 + 점검이력을 localStorage에 보관.
   ============================================================ */
const LegacyStore={
  KEY:"aedcare.v1",
  _db:null,
  _load(){
    if(this._db)return this._db;
    try{const raw=localStorage.getItem(this.KEY);if(raw){this._db=JSON.parse(raw);
      if(!this._db.events)this._db.events=[];
      if(!this._db.tasks)this._db.tasks=[];
      if(!this._db.quiz)this._db.quiz=SEED_QUIZ.slice();
      return this._db;}}catch(e){}
    this._db={devices:SEED.slice(),quiz:SEED_QUIZ.slice(),events:[],tasks:[]};
    this._save();
    return this._db;
  },
  _save(){try{localStorage.setItem(this.KEY,JSON.stringify(this._db));}catch(e){console.warn("save fail",e);}},

  /* ---- 기기 ---- */
  listDevices(){return this._load().devices.slice();},
  getDevice(id){return this._load().devices.find(d=>d.id===id)||null;},
  addDevice(d){
    const db=this._load();
    const dev={
      id:d.id||uid(),name:d.name,address:d.address,
      model:d.model||"",
      building:d.building||"",floor:d.floor||"",spot:d.spot||"",  // 건물명/층수/상세위치
      hours:d.hours||"",access:d.access||"",                      // 운영시간/출입 가능여부
      source:d.source||"manual",                                  // 데이터 출처: manual | csv | public
      lat:+d.lat,lng:+d.lng,
      manager:d.manager||"",phone:d.phone||"",
      battery_expiry:d.battery_expiry||"",pad_expiry:d.pad_expiry||"",
      install_date:d.install_date||todayStr(),
      inspect_cycle_days:+d.inspect_cycle_days||180,
      inspections:[],
    };
    db.devices.push(dev);this._save();return dev;
  },
  updateDevice(id,patch){
    const db=this._load();const d=db.devices.find(x=>x.id===id);if(!d)return null;
    Object.assign(d,patch);this._save();return d;
  },
  removeDevice(id){
    const db=this._load();db.devices=db.devices.filter(d=>d.id!==id);this._save();
  },

  /* ---- 점검 ---- */
  addInspection(deviceId,rec){
    const db=this._load();const d=db.devices.find(x=>x.id===deviceId);if(!d)return null;
    const ins={date:rec.date||todayStr(),result:rec.result||"정상",inspector:rec.inspector||"",memo:rec.memo||"",photo:rec.photo||null};
    d.inspections=d.inspections||[];d.inspections.unshift(ins);this._save();return ins;
  },
  lastInspection(d){return (d.inspections&&d.inspections[0])||null;},
  nextInspectionDate(d){
    const last=this.lastInspection(d);
    const base=last?last.date:d.install_date||todayStr();
    return addDays(base,d.inspect_cycle_days||180);
  },

  /* ---- AED 사용(작동) 이벤트 로그 ----
     앱은 119 신고를 대체하지 않는다. 여기 기록은 '사용 사실'과
     각 처리의 '상태'만 남긴다. 실제 전송이 확인되지 않으면 성공으로 적지 않는다. */
  addUsageEvent(ev){
    const db=this._load();
    const e={id:"EV-"+Date.now().toString(36).toUpperCase(),ts:new Date().toISOString(),
      deviceId:ev.deviceId||null,deviceName:ev.deviceName||"",address:ev.address||"",
      lat:(ev.lat!=null?ev.lat:null),lng:(ev.lng!=null?ev.lng:null),
      // 처리 상태: "called119"(사용자가 119 통화 시도) / "not_integrated"(관리자 알림 미연동)
      call119:ev.call119||"unknown",          // "attempted" | "unknown"
      managerNotify:"not_integrated",          // 실제 전송 서비스 미연동 고정
      recovery:"pending",                      // 사용 후 복구: pending → done (P2-2에서 사용)
      note:ev.note||""};
    db.events=db.events||[];db.events.unshift(e);this._save();
    // 사용된 기기는 '사용 후 점검 필요' 플래그를 세운다 (후속 조치 추적)
    if(ev.deviceId){const d=db.devices.find(x=>x.id===ev.deviceId);if(d){d.needs_post_use_check=true;this._save();}}
    return e;
  },
  listEvents(){return (this._load().events||[]).slice();},
  getEvent(id){return (this._load().events||[]).find(e=>e.id===id)||null;},
  updateEvent(id,patch){const db=this._load();const e=(db.events||[]).find(x=>x.id===id);if(!e)return null;Object.assign(e,patch);this._save();return e;},

  /* ---- 조치 작업(Task) — 위험 상태에 대한 후속 작업 관리 (P1 4-1) ---- */
  listTasks(){return (this._load().tasks||[]).slice();},
  getTask(id){return (this._load().tasks||[]).find(t=>t.id===id)||null;},
  addTask(t){
    const db=this._load();db.tasks=db.tasks||[];
    const task={id:"T-"+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*90+10),
      deviceId:t.deviceId||null,title:t.title||"조치",reason:t.reason||"",
      assignee:t.assignee||"",due:t.due||"",status:t.status||"미처리",
      work:t.work||"",photo:t.photo||null,
      created:new Date().toISOString(),updated:new Date().toISOString(),
      history:[{ts:new Date().toISOString(),action:"생성",detail:t.reason||""}]};
    db.tasks.unshift(task);this._save();return task;
  },
  updateTask(id,patch,actionLabel){
    const db=this._load();const t=(db.tasks||[]).find(x=>x.id===id);if(!t)return null;
    Object.assign(t,patch);t.updated=new Date().toISOString();
    t.history=t.history||[];t.history.unshift({ts:t.updated,action:actionLabel||"수정",detail:patch.status||patch.work||""});
    this._save();return t;
  },
  /* 위험 상태 기기에 대해 미완료 작업이 없으면 자동 생성 */
  ensureTasksForRisk(){
    const db=this._load();db.tasks=db.tasks||[];let created=0;
    db.devices.forEach(d=>{
      const st=deviceStatus(d);
      if(st.level==="ok")return;
      const open=db.tasks.find(t=>t.deviceId===d.id&&t.status!=="완료");
      if(open)return;
      db.tasks.unshift({id:"T-"+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*900+100),
        deviceId:d.id,title:st.label,reason:st.reasons.join(" / "),
        assignee:d.manager||"",due:"",status:"미처리",work:"",photo:null,
        created:new Date().toISOString(),updated:new Date().toISOString(),
        history:[{ts:new Date().toISOString(),action:"자동 생성",detail:st.reasons.join(" / ")}]});
      created++;
    });
    if(created)this._save();
    return created;
  },

  reset(){localStorage.removeItem(this.KEY);this._db=null;this._load();},
};

/* 버전 스키마 Store. LegacyStore는 v1 구조를 읽는 참고 구현이며 실제 접근은 아래 Store로 통일한다. */
const SCHEMA_VERSION=4;
const LEGACY_DEMO_DEVICE_IDS=new Set(["AED-001","AED-002","AED-003","AED-004","AED-005"]);
const DEFAULT_SETTINGS={org:"AED Care 운영기관",alertDays:30,monthlyTarget:100};
function cloneData(value){return value===undefined?undefined:JSON.parse(JSON.stringify(value));}
function normalizeSearch(value){return String(value==null?"":value).normalize("NFKC").toLocaleLowerCase("ko-KR").replace(/\s+/g," ").trim();}
function deviceSearchText(d){return normalizeSearch([d.name,d.address,d.building,d.floor,d.spot,d.model,productName(d.model),d.manager,d.phone,d.source_maker,d.source_model].join(" "));}
function matchesSearch(values,query){const q=normalizeSearch(query);return !q||normalizeSearch(Array.isArray(values)?values.join(" "):values).includes(q);}
function makeTaskId(){return "T-"+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*9000+1000);}
const Store={
  KEY:"aedcare.v1",_db:null,
  _seed(){return {schemaVersion:SCHEMA_VERSION,virtualDataCleaned:true,settings:cloneData(DEFAULT_SETTINGS),devices:[],quiz:cloneData(SEED_QUIZ),events:[],tasks:[]};},
  _normalizeDevice(d={}){return {...d,id:String(d.id||uid()),name:String(d.name||""),address:String(d.address||""),model:String(d.model||""),building:String(d.building||""),floor:String(d.floor||""),spot:String(d.spot||""),hours:String(d.hours||""),access:String(d.access||""),source:String(d.source||"manual"),source_maker:String(d.source_maker||""),source_model:String(d.source_model||""),lat:Number(d.lat),lng:Number(d.lng),manager:String(d.manager||""),phone:String(d.phone||""),battery_expiry:String(d.battery_expiry||""),pad_expiry:String(d.pad_expiry||""),install_date:String(d.install_date||todayStr()),inspect_cycle_days:Math.max(1,Number(d.inspect_cycle_days)||180),needs_post_use_check:Boolean(d.needs_post_use_check),inspections:Array.isArray(d.inspections)?d.inspections.map(i=>({...i,date:String(i.date||""),result:String(i.result||"정상"),inspector:String(i.inspector||""),memo:String(i.memo||""),photo:i.photo||null})):[]};},
  _migrate(raw){
    if(!raw||typeof raw!=="object"||Array.isArray(raw))throw new Error("저장 데이터 형식이 올바르지 않습니다.");
    const db=cloneData(raw);const sourceVersion=Number(db.schemaVersion)||1;db.schemaVersion=SCHEMA_VERSION;
    db.settings={...DEFAULT_SETTINGS,...(db.settings&&typeof db.settings==="object"?db.settings:{})};
    db.settings.org=String(db.settings.org||DEFAULT_SETTINGS.org).slice(0,100);
    db.settings.alertDays=Math.min(365,Math.max(1,Number(db.settings.alertDays)||DEFAULT_SETTINGS.alertDays));
    db.settings.monthlyTarget=Number.isFinite(Number(db.settings.monthlyTarget))?Math.min(100,Math.max(0,Number(db.settings.monthlyTarget))):DEFAULT_SETTINGS.monthlyTarget;
    db.devices=(Array.isArray(db.devices)?db.devices:[]).map(d=>this._normalizeDevice(d));
    db.quiz=Array.isArray(db.quiz)?db.quiz:cloneData(SEED_QUIZ);
    db.events=(Array.isArray(db.events)?db.events:[]).map(e=>({...e,id:String(e.id||"EV-"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5)),ts:String(e.ts||new Date().toISOString()),deviceId:e.deviceId||null,deviceName:String(e.deviceName||""),address:String(e.address||""),lat:e.lat==null?null:Number(e.lat),lng:e.lng==null?null:Number(e.lng),call119:e.call119||"unknown",managerNotify:"not_integrated",recovery:e.recovery==="done"?"done":"pending",note:String(e.note||""),recoveredAt:e.recoveredAt||(e.recovery==="done"?(e.ts||null):null),by:String(e.by||e.recoveredBy||""),checks:e.checks&&typeof e.checks==="object"?e.checks:{},memo:String(e.memo||e.recoveryMemo||""),photo:e.photo||e.recoveryPhoto||null,recoveredBy:String(e.by||e.recoveredBy||""),recoveryMemo:String(e.memo||e.recoveryMemo||""),recoveryPhoto:e.photo||e.recoveryPhoto||null}));
    db.tasks=(Array.isArray(db.tasks)?db.tasks:[]).map(t=>({...t,id:String(t.id||makeTaskId()),deviceId:t.deviceId||null,eventId:t.eventId||null,type:t.type||"risk",title:String(t.title||"조치"),reason:String(t.reason||""),assignee:String(t.assignee||""),due:String(t.due||""),status:String(t.status||"미처리"),work:String(t.work||""),photo:t.photo||null,created:t.created||new Date().toISOString(),updated:t.updated||t.created||new Date().toISOString(),history:Array.isArray(t.history)?t.history:[]}));
    // v3 최초 실행 시 과거에 제공한 기본 5대와 SafeMap 가상 50건만 제거한다.
    // 이후 실제로 가져오는 public 데이터는 virtualDataCleaned 플래그로 보호된다.
    if(sourceVersion<3&&!db.virtualDataCleaned){
      const virtualIds=new Set(db.devices.filter(d=>LEGACY_DEMO_DEVICE_IDS.has(d.id)||d.source==="public").map(d=>d.id));
      db.devices=db.devices.filter(d=>!virtualIds.has(d.id));
      db.events=db.events.filter(e=>!e.deviceId||!virtualIds.has(e.deviceId));
      db.tasks=db.tasks.filter(t=>!t.deviceId||!virtualIds.has(t.deviceId));
      db.virtualDataCleaned=true;
    }
    // v4: 공공 AED(SafeMap)는 DB에서만 조회한다. 브라우저에 저장된 공공데이터 기기는 항상 제거한다.
    {
      const publicIds=new Set(db.devices.filter(d=>d.source==="public").map(d=>d.id));
      if(publicIds.size){
        db.devices=db.devices.filter(d=>!publicIds.has(d.id));
        db.events=db.events.filter(e=>!e.deviceId||!publicIds.has(e.deviceId));
        db.tasks=db.tasks.filter(t=>!t.deviceId||!publicIds.has(t.deviceId));
      }
    }
    db.events.filter(e=>e.recovery!=="done").forEach(e=>{let task=db.tasks.find(t=>t.eventId===e.id&&t.type==="post_use_recovery");if(!task){task=this._recoveryTask(e);db.tasks.unshift(task);}e.taskId=task.id;});
    db.devices.forEach(d=>{d.needs_post_use_check=db.events.some(e=>e.deviceId===d.id&&e.recovery!=="done");});return db;
  },

function getAlertDays(){const n=Number(Store.getSettings().alertDays);return Number.isFinite(n)&&n>0?n:30;}

/* ============================================================
   상태 판정 — 유효기간/점검주기/최종 점검결과로 기기 상태 산출
   반환: {code, label, level:"ok|warn|danger"(하위호환), reasons:[], asOf, basis}
   8단계 code:
     normal          정상
     inspect_due     점검 예정
     inspect_overdue 점검 기한 초과
     battery_due     배터리 교체 필요
     pad_due         패드 교체 필요
     repair          수리 필요
     unusable        사용 불가
     unverified      상태 미확인(점검 기록 없음/오래됨)
   ============================================================ */
const STALE_DAYS=400;        // 최종 점검이 이보다 오래되면 '미확인'으로 간주(연 1회+여유)
/* code → {label, level} 매핑. level은 기존 UI(badge/marker/정렬) 하위호환용 */
const STATUS_DEF={
  normal:{label:"정상",level:"ok"},
  inspect_due:{label:"점검 예정",level:"warn"},
  inspect_overdue:{label:"점검 기한 초과",level:"danger"},
  battery_due:{label:"배터리 교체 필요",level:"warn"},
  pad_due:{label:"패드 교체 필요",level:"warn"},
  repair:{label:"수리 필요",level:"danger"},
  unusable:{label:"사용 불가",level:"danger"},
  unverified:{label:"상태 미확인",level:"warn"},
  post_use:{label:"사용 후 점검 필요",level:"danger"},
};
/* 점검 결과 문자열 → 심각 상태 code (수리필요/사용불가 우선 반영) */
function resultToCode(result){
  const v=String(result||"").replace(/\s/g,"");
  if(v.includes("사용불가"))return "unusable";
  if(v.includes("수리"))return "repair";
  return null;
}
function deviceStatus(d){
  const today=todayStr();const reasons=[];
  const last=Store.lastInspection(d);
  const SEV=["normal","inspect_due","battery_due","pad_due","unverified","inspect_overdue","repair","unusable","post_use"];
  let code="normal";
  const raise=(c,why)=>{if(why&&!reasons.includes(why))reasons.push(why);if(SEV.indexOf(c)>SEV.indexOf(code))code=c;};

  // AED 사용 이후 복구 완료 전에는 다른 조건보다 우선해 현장 점검을 요구한다.
  if(d.needs_post_use_check)raise("post_use","AED 사용 후 복구·재사용 준비 확인이 완료되지 않음");

  // 최종 점검 결과가 수리필요/사용불가면 즉시 위험 상태로 표시한다.
  const rc=last?resultToCode(last.result):null;
  if(rc)raise(rc,`최종 점검 결과: ${last.result} (${last.date})`);

  // 소모품 날짜가 없으면 정상으로 판정하지 않는다.
  const chk=(label,date,dueCode)=>{
    if(!date){raise("unverified",`${label} 유효기간 미확인`);return;}
    const left=daysBetween(today,date);
    if(left<0)raise(dueCode,`${label} 만료 (${-left}일 경과)`);
    else if(left<=getAlertDays())raise(dueCode,`${label} 만료 임박 (D-${left})`);
  };
  chk("배터리",d.battery_expiry,"battery_due");
  chk("패드",d.pad_expiry,"pad_due");

  // 기관별 기기 점검주기와 이번 달 점검 기록을 별도로 확인한다.
  const next=Store.nextInspectionDate(d);const nleft=daysBetween(today,next);
  if(nleft<0)raise("inspect_overdue",`점검 기한 초과 (${-nleft}일)`);
  else if(nleft<=getAlertDays())raise("inspect_due",`점검 예정 (D-${nleft})`);
  const currentMonth=today.slice(0,7);
  if(!(d.inspections||[]).some(i=>String(i.date||"").slice(0,7)===currentMonth))raise("inspect_due",`${currentMonth} 월별 점검 기록 미확인`);

  // 핵심 관리정보 또는 점검 근거가 없으면 미확인 상태로 둔다.
  if(!last)raise("unverified","점검 기록 없음 — 상태 확인 필요");
  else if(daysBetween(last.date,today)>STALE_DAYS)raise("unverified",`최종 점검이 오래됨 (${last.date})`);
  if(!d.model)raise("unverified","제품 모델 미확인");
  if(!Number.isFinite(Number(d.lat))||!Number.isFinite(Number(d.lng))||Number(d.lat)===0||Number(d.lng)===0)raise("unverified","설치 좌표 미확인");

  const def=STATUS_DEF[code]||STATUS_DEF.normal;
  return {code,label:def.label,level:def.level,reasons,asOf:last?last.date:null,
    basis:"사용 후 복구 · 소모품 유효기간 · 월별/기관별 점검주기 · 최종 점검결과"};
}
/* 상태 뱃지 — code 기준. '미확인'은 중립(회색) 톤으로 표시 */
function statusBadge(st,text){
  const cls=st.code==="unverified"?"neutral":st.level;
  return `<span class="badge ${cls}">${esc(text||st.label)}</span>`;
}

/* 시급도 점수 — 값이 클수록 더 시급. 대시보드/기기관리 정렬에 사용.
   레벨(위험>임박>정상)을 우선하고, 같은 레벨 안에서는 '가장 임박한 기한까지 남은 일수'로 정렬.
   (만료를 많이 넘겼거나 D-day가 가까울수록 점수가 커짐) */
function urgencyScore(d){
  const today=todayStr();
  const dates=[d.battery_expiry,d.pad_expiry,Store.nextInspectionDate(d)].filter(Boolean);
  let minLeft=Infinity;
  dates.forEach(dt=>{const left=daysBetween(today,dt);if(left<minLeft)minLeft=left;});
  const st=deviceStatus(d);
  // code별 가중치 (사용불가·수리필요가 최상위)
  const CODE_W={post_use:10000000,unusable:9000000,repair:8000000,inspect_overdue:5000000,
    unverified:3000000,battery_due:2500000,pad_due:2400000,inspect_due:1500000,normal:0};
  const base=CODE_W[st.code]!=null?CODE_W[st.code]:({danger:2000000,warn:1000000,ok:0}[st.level]||0);
  return base-(minLeft===Infinity?0:minLeft);
}
/* 시급한 순으로 정렬된 기기 목록 */
function devicesByUrgency(list){
  return (list||Store.listDevices()).slice().sort((a,b)=>urgencyScore(b)-urgencyScore(a));
}

/* 제품 이미지: 실제 사진(p.img)이 있으면 사진을, 로드 실패 시 오리지널 일러스트로 폴백.
   사진을 images/ 폴더에 넣으면 자동으로 사진이 우선 표시된다. */
function productMedia(p,{big=false}={}){
  const h=big?170:124;
  const svg=productSvg(p,{big});
  if(p.img){
    // onerror: 사진 파일이 없으면 자리의 일러스트로 교체
    return `<img src="${p.img}" alt="${esc(p.name)} 제품 사진" loading="lazy"
      style="width:100%;height:${h}px;object-fit:contain"
      onerror="this.outerHTML=this.getAttribute('data-fallback')"
      data-fallback='${svg.replace(/'/g,"&#39;")}'>`;
  }

/* 조치사항 가이드 — 상태 원인별 필요 조치 + 준비물 (출동 체크리스트) */
function actionGuide(d){
  const today=todayStr();const items=[];
  const batLeft=d.battery_expiry?daysBetween(today,d.battery_expiry):null;
  const padLeft=d.pad_expiry?daysBetween(today,d.pad_expiry):null;
  const next=Store.nextInspectionDate(d);const nLeft=daysBetween(today,next);
  if(d.needs_post_use_check)items.push({urgent:true,task:"AED 사용 후 복구·재사용 준비 확인",
    prep:["사용 기록 및 현장 상황 확인","패드 교체 여부 확인","배터리 상태 확인","자가점검 결과 확인","재배치 후 재사용 가능 여부 확인"]});
  if(batLeft==null)items.push({urgent:false,task:"배터리 유효기간 확인",prep:["기기 라벨 또는 공식 자료 확인","확인한 유효기간 등록","규격이 불명확하면 제조사 문의"]});
  else if(batLeft<=getAlertDays())items.push({urgent:batLeft<0,task:batLeft<0?`배터리 교체 (${-batLeft}일 경과)`:`배터리 교체 준비 (D-${batLeft})`,
    prep:["제품 라벨·공식 매뉴얼로 확인한 호환 배터리","필요 공구","교체 후 자가점검 및 유효기간 등록"]});
  if(padLeft==null)items.push({urgent:false,task:"패드 유효기간 확인",prep:["패드 포장·기기 라벨 확인","확인한 유효기간 등록","호환 규격이 불명확하면 제조사 문의"]});
  else if(padLeft<=getAlertDays())items.push({urgent:padLeft<0,task:padLeft<0?`패드 교체 (${-padLeft}일 경과)`:`패드 교체 준비 (D-${padLeft})`,
    prep:["제품 라벨·공식 매뉴얼로 확인한 호환 패드","성인·소아 적용 방식 확인","교체 후 밀봉·유효기간·연결 상태 확인"]});
  if(nLeft<=getAlertDays())items.push({urgent:nLeft<0,task:nLeft<0?`정기 점검 기한 초과 (${-nLeft}일)`:`정기 점검 예정 (D-${nLeft})`,
    prep:["기관 점검 체크리스트","기기 외관·상태 표시 확인","점검 결과 사진 촬영","점검 이력 등록"]});
  if(!d.model)items.push({urgent:false,task:"제품 모델 확인",prep:["기기 명판 촬영","제조사·정확한 모델 코드 등록","공식 매뉴얼과 소모품 정보 확인"]});
  if(!items.length)items.push({urgent:false,task:"현재 조치 필요 없음",prep:["다음 정기 점검일까지 모니터링"]});
  return items;
}

/* ------------------------------------------------------------
   공공 AED 데이터베이스(Supabase, SafeMap 62,000건) 레이어
   브라우저는 /api/aeds 만 호출하고, DB 키는 서버(server.py)에만 있습니다.
   ------------------------------------------------------------ */
const DB_MIN_ZOOM=14,DB_FETCH_LIMIT=2000,DB_LIST_LIMIT=30; // DB_MIN_ZOOM 이상: 개별 위치·상세, 미만: 전국 묶음 표시
let _dbLayer=null,_dbMarkers={},_dbItems=[],_dbConfigured=null,_dbTimer=null,_dbSeq=0,_dbLoadedBounds=null,_dbTruncated=false,_dbOriginLabel="지도 중심에서",_dbActiveId=null,_userLoc=null,_mapFilter={q:"",status:""};
let _dbClusterLayer=null,_dbPoints=null,_dbPointsPromise=null; // 전국 좌표 묶음(한 번 받으면 화면을 옮겨도 재사용)
function resetDbLayerState(){clearTimeout(_dbTimer);_dbSeq++;_dbLayer=null;_dbClusterLayer=null;_dbMarkers={};_dbItems=[];_dbLoadedBounds=null;_dbTruncated=false;_dbActiveId=null;}
function loadDbPoints(){
  if(_dbPoints)return Promise.resolve(_dbPoints);
  if(!_dbPointsPromise)_dbPointsPromise=fetch("/api/aeds/points").then(async r=>{const j=await r.json();if(!r.ok||!Array.isArray(j.points))throw new Error(j.message||"조회 실패");_dbPoints=j;return j;}).catch(e=>{_dbPointsPromise=null;throw e;});
  return _dbPointsPromise;
}
function fmtCount(n){return n>=10000?`${(n/10000).toFixed(1).replace(/\.0$/,"")}만`:Number(n).toLocaleString("ko-KR");}
/* 전국 보기: 화면 픽셀 격자로 좌표를 묶어 숫자 원으로 표시 (확대 수준 DB_MIN_ZOOM 미만) */
function renderDbClusters(){
  if(_dbClusterLayer)_dbClusterLayer.clearLayers();
  if(!_map||!_dbClusterLayer||!_dbPoints||_map.getZoom()>=DB_MIN_ZOOM)return 0;
  if(_mapFilter.status&&_mapFilter.status!=="unverified")return 0;
  const z=_map.getZoom(),b=_map.getBounds().pad(0.1),S=_dbPoints.scale||100000,P=_dbPoints.points,cell=z>=10?52:64,world=256*Math.pow(2,z);
  const minLat=b.getSouth(),maxLat=b.getNorth(),minLng=b.getWest(),maxLng=b.getEast(),view=_map.getBounds();
  const cells=new Map();let inView=0;
  for(let i=0;i<P.length;i+=3){
    const lat=P[i]/S,lng=P[i+1]/S;if(lat<minLat||lat>maxLat||lng<minLng||lng>maxLng)continue;
    if(view.contains([lat,lng]))inView++;
    const s=Math.sin(lat*Math.PI/180),x=(lng+180)/360*world,y=(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*world;
    const k=Math.floor(x/cell)*100000+Math.floor(y/cell);let c=cells.get(k);if(!c){c={n:0,lat:0,lng:0};cells.set(k,c);}c.n++;c.lat+=lat;c.lng+=lng;
  }
  cells.forEach(c=>{
    const lat=c.lat/c.n,lng=c.lng/c.n,size=c.n>=5000?60:c.n>=1000?52:c.n>=100?44:c.n>=10?36:28;
    const m=L.marker([lat,lng],{icon:L.divIcon({className:"",html:`<div class="db-cluster" style="width:${size}px;height:${size}px">${fmtCount(c.n)}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]}),title:`공공 AED ${c.n.toLocaleString("ko-KR")}곳 · 눌러서 확대`});
    m.on("click",()=>_map.setView([lat,lng],c.n<=30?DB_MIN_ZOOM+1:Math.min(DB_MIN_ZOOM+1,z+2)));
    m.addTo(_dbClusterLayer);
  });
  return inView;
}
/* 시도별 범위로 이동 */
function flyToSido(name){
  if(!_map||!_dbPoints)return;const idx=_dbPoints.sidoNames.indexOf(name);if(idx<0)return;
  const S=_dbPoints.scale||100000,P=_dbPoints.points,lats=[],lngs=[];
  for(let i=0;i<P.length;i+=3){if(P[i+2]===idx){lats.push(P[i]/S);lngs.push(P[i+1]/S);}}
  if(!lats.length)return;
  // 시도 값과 좌표가 어긋난 일부 레코드 때문에 범위가 넓어지지 않도록 양끝 2%를 제외
  lats.sort((x,y)=>x-y);lngs.sort((x,y)=>x-y);
  const q=(arr,p)=>arr[Math.min(arr.length-1,Math.max(0,Math.round((arr.length-1)*p)))];
  _map.fitBounds([[q(lats,.02),q(lngs,.02)],[q(lats,.98),q(lngs,.98)]],{padding:[20,20],maxZoom:12});

function distanceMeters(lat1,lng1,lat2,lng2){const R=6371000,toR=x=>x*Math.PI/180,dLat=toR(lat2-lat1),dLng=toR(lng2-lng1);const h=Math.sin(dLat/2)**2+Math.cos(toR(lat1))*Math.cos(toR(lat2))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));}

    :`<div class="db-note">이 지역에서 조건에 맞는 공공 AED가 없습니다.</div>`);
  box.querySelectorAll("[data-db-id]").forEach(it=>{const select=()=>{

    box.querySelectorAll(".db-item").forEach(x=>x.classList.remove("active"));it.classList.add("active");
    if(_map){_map.setView([Number(a.latitude),Number(a.longitude)],Math.max(_map.getZoom(),17));_dbMarkers[a.id]&&_dbMarkers[a.id].openPopup();}

function renderDbLayer(){
  const items=dbVisibleItems();
  if(_map&&_dbLayer){
    _dbLayer.clearLayers();_dbMarkers={};
    items.forEach(a=>{const lat=Number(a.latitude),lng=Number(a.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;
      const m=L.circleMarker([lat,lng],{radius:7,color:"#fff",weight:2,fillColor:"#0f8b8d",fillOpacity:.9});
      m.bindPopup(dbPopupHtml(a));m.on("click",()=>{_dbActiveId=a.id;});m.addTo(_dbLayer);_dbMarkers[a.id]=m;});
    if(_dbActiveId&&_dbMarkers[_dbActiveId])_dbMarkers[_dbActiveId].openPopup();
  }
  renderDbItems(items);
}
/* 검색어·상태 필터가 바뀌면 이미 받은 DB 결과에 다시 적용 */
function refreshDbView(){
  if(_map&&_dbPoints&&_map.getZoom()<DB_MIN_ZOOM){renderDbOverview(renderDbClusters());return;}
  if(_dbItems.length)renderDbLayer();
}
async function loadDbAeds(session){
  if(!_map||session!==_mapSession||!_dbLayer)return;
  if(_map.getZoom()<DB_MIN_ZOOM){
    _dbSeq++;_dbItems=[];_dbLoadedBounds=null;_dbLayer.clearLayers();_dbMarkers={};
    if(!_dbPoints){renderDbItems([],"전국 공공 AED 위치를 불러오는 중…");return;}
    renderDbOverview(renderDbClusters());return;
  }
  if(_dbClusterLayer)_dbClusterLayer.clearLayers();
  const view=_map.getBounds();
  if(_dbLoadedBounds&&!_dbTruncated&&_dbLoadedBounds.contains(view))return; // 이미 받은 범위 안 (팝업 자동 이동 등)
  const area=view.pad(0.15); // 조금 넓게 받아 작은 이동에는 다시 조회하지 않음
  const origin=_userLoc&&area.contains(_userLoc)?_userLoc:_map.getCenter();
  const seq=++_dbSeq;
  const qs=new URLSearchParams({bbox:[area.getWest(),area.getSouth(),area.getEast(),area.getNorth()].map(v=>v.toFixed(5)).join(","),limit:String(DB_FETCH_LIMIT),lat:origin.lat.toFixed(6),lng:origin.lng.toFixed(6)});
  if(!_dbItems.length)renderDbItems([],"공공 AED 데이터베이스 조회 중…");
  try{
    const r=await fetch(`/api/aeds?${qs}`,{cache:"no-store"});const j=await r.json();
    if(seq!==_dbSeq||session!==_mapSession)return;
    if(!r.ok)throw new Error(j.message||"조회 실패");
    _dbItems=Array.isArray(j.items)?j.items:[];_dbTruncated=!!j.truncated;_dbLoadedBounds=area;
    _dbOriginLabel=origin===_userLoc?"내 위치에서":"지도 중심에서";
    if(_dbActiveId&&!_dbItems.some(a=>String(a.id)===String(_dbActiveId)))_dbActiveId=null;
    renderDbLayer();
  }catch(e){if(seq===_dbSeq)renderDbItems([],`공공 AED 데이터베이스를 불러오지 못했습니다. (${e.message})`);}
}
async function setupDbLayer(session,hasLocal){
  const ok=await checkDbConfigured();
  if(!_map||session!==_mapSession)return;
  if(!ok){renderDbItems([],"공공 AED 데이터베이스가 서버에 연결되어 있지 않습니다. 서버의 .env 설정을 확인하세요.");return;}
  _dbLayer=L.layerGroup().addTo(_map);_dbClusterLayer=L.layerGroup().addTo(_map);
  _map.on("moveend",()=>{clearTimeout(_dbTimer);_dbTimer=setTimeout(()=>loadDbAeds(session),250);});
  loadDbAeds(session);
  loadDbPoints().then(()=>{if(_map&&session===_mapSession)loadDbAeds(session);})
    .catch(e=>{if(_map&&session===_mapSession&&_map.getZoom()<DB_MIN_ZOOM)renderDbItems([],`전국 공공 AED 위치를 불러오지 못했습니다. (${e.message})`);});
}
/* 배경지도 제한으로 좌표 지도(오프라인)로 바뀐 경우 안내 */
function dbStaticFallbackNotice(){
  resetDbLayerState();
  checkDbConfigured().then(ok=>{if(ok&&!_map)renderDbItems([],"배경지도 제한으로 공공 AED를 지도에 표시할 수 없습니다. ‘내 위치’ 버튼을 누르면 가까운 공공 AED를 목록으로 안내합니다.");});
}
/* 내 위치 기준 가장 가까운 공공 AED (오프라인 지도에서는 목록으로 표시) */
async function fetchNearestDb(lat,lng){
  if(!(await checkDbConfigured()))return [];
  try{
    const r=await fetch(`/api/aeds/nearest?lat=${lat.toFixed(6)}&lng=${lng.toFixed(6)}&limit=${_map?1:DB_LIST_LIMIT}`,{cache:"no-store"});const j=await r.json();
    if(!r.ok)return [];
    const items=Array.isArray(j.items)?j.items:[];
    if(!_map){_dbItems=items;_dbTruncated=false;_dbOriginLabel="내 위치에서";renderDbItems(dbVisibleItems());}
    return items;
  }catch(e){return [];}
}
function locateUser(){
  if(!navigator.geolocation){toast("이 브라우저는 위치 기능을 지원하지 않습니다.");return;}
  toast("위치를 확인하는 중…");
  navigator.geolocation.getCurrentPosition(pos=>{
    const{latitude:lat,longitude:lng}=pos.coords;
    _userLoc=window.L&&typeof L.latLng==="function"?L.latLng(lat,lng):{lat,lng};_dbLoadedBounds=null;
    if(_map){
      if(_userMarker)_map.removeLayer(_userMarker);
      _userMarker=L.circleMarker([lat,lng],{radius:9,color:"#2f6bff",fillColor:"#2f6bff",fillOpacity:.9,weight:3}).addTo(_map);
      _map.setView([lat,lng],Math.max(DB_MIN_ZOOM+2,_map.getZoom()));
    }else setMapNotice("현재 위치를 확인했습니다. 배경지도 제한으로 가까운 AED를 목록에서 안내합니다.","warn");
    // 가장 가까운 AED 안내: 관리 등록 기기 + 공공 AED DB 중 실제 거리(m)가 가장 짧은 곳
    const devices=validMapDevices(Store.listDevices());
    let near=null,best=Infinity;
    devices.forEach(d=>{const dist=distanceMeters(lat,lng,Number(d.lat),Number(d.lng));if(dist<best){best=dist;near={name:d.name,dist};}});
    fetchNearestDb(lat,lng).then(items=>{
      const a=items[0];
      if(a&&Number.isFinite(Number(a.distance_m))&&Number(a.distance_m)<best)near={name:a.name,dist:Number(a.distance_m)};
      if(near)toast(`가장 가까운 AED: ${near.name} (직선 약 ${fmtDist(near.dist)})`);
      else toast("주변에서 AED를 찾지 못했습니다. 지도를 이동해 확인하세요.");
    });
  },err=>{toast("위치 권한이 거부되었습니다. 지도에서 직접 찾아보세요.");},{enableHighAccuracy:true,timeout:8000});
}

function citizenExpiry(date){
  if(!date)return `<span class="muted">-</span>`;
  const left=daysBetween(todayStr(),date);
  const cls=left<0?"danger":left<=getAlertDays()?"warn":"ok";
  const tag=left<0?"만료":left<=getAlertDays()?"임박":"양호";
  return `<span class="badge ${cls}" style="font-size:10px;padding:2px 7px">${tag}</span>`;
}

let _learnIdx=0,_quizMode=false,_quizAnswers=[];
Views.learn=function(host){
  _learnIdx=0;_quizMode=false;_quizAnswers=[];
  renderLearn(host);
};
function renderLearn(host){
  if(_quizMode){renderQuiz(host);return;}
  const total=LEARN_STEPS.length;const s=LEARN_STEPS[_learnIdx];
  const segs=LEARN_STEPS.map((_,i)=>`<div class="seg ${i<=_learnIdx?"on":""}"></div>`).join("");
  host.innerHTML=`
    <div class="learn-stage">
      <div class="page-head" style="justify-content:center;text-align:center"><div>
        <h1>AED 사용법 3분 학습</h1><p>한 단계씩 따라 하면 누구나 응급상황에서 대처할 수 있습니다.</p></div></div>
      <div class="learn-progress">${segs}</div>
      <div class="card step-card">
        <div class="step-ico">${s.ico}</div>
        <div class="n">${s.n} / 총 ${total}단계</div>
        <h2>${s.title}</h2>
        <p>${s.desc}</p>
      </div>
      <div class="step-nav">
        <button class="btn" id="prevStep" ${_learnIdx===0?"disabled":""}>← 이전</button>
        <button class="btn solid" id="nextStep">${_learnIdx===total-1?"퀴즈 풀기 →":"다음 →"}</button>
      </div>
      <p class="muted" style="font-size:11px;text-align:center;margin-top:14px">${esc(LEARN_SOURCE.note)} · 출처/개정일 ${esc(LEARN_SOURCE.rev)} (${esc(LEARN_SOURCE.checked)})<br>실제 응급처치는 최신 공식 지침과 AED 음성 안내를 우선합니다.</p>
    </div>`;
  $("#prevStep").addEventListener("click",()=>{if(_learnIdx>0){_learnIdx--;renderLearn(host);}});
  $("#nextStep").addEventListener("click",()=>{
    if(_learnIdx<total-1){_learnIdx++;renderLearn(host);}
    else{_quizMode=true;_quizAnswers=[];renderQuiz(host);}
  });
}
function renderQuiz(host){
  const quiz=Store.listQuiz();
  host.innerHTML=`
    <div class="learn-stage">
      <div class="page-head" style="justify-content:center;text-align:center"><div>
        <h1>확인 퀴즈</h1><p>세 문항으로 핵심을 점검해 보세요.</p></div></div>
      <div id="quizBox">${quiz.map((item,qi)=>`
        <div class="quiz-q" data-q="${qi}">
          <h3>Q${qi+1}. ${esc(item.q)}</h3>
          ${item.opts.map((o,oi)=>`<button class="quiz-opt" data-q="${qi}" data-o="${oi}">${esc(o)}</button>`).join("")}
        </div>`).join("")}</div>
      <div id="quizResult"></div>
      <div class="step-nav">
        <button class="btn" id="backLearn">← 학습으로</button>
        <button class="btn solid" id="resetQuiz">다시 풀기</button>
      </div>
    </div>`;
  host.querySelectorAll(".quiz-opt").forEach(btn=>btn.addEventListener("click",()=>{
    const qi=+btn.dataset.q,oi=+btn.dataset.o;
    if(_quizAnswers[qi]!=null)return;
    _quizAnswers[qi]=oi;
    const correct=quiz[qi].answer;
    const qEl=host.querySelector(`.quiz-q[data-q="${qi}"]`);
    qEl.querySelectorAll(".quiz-opt").forEach(b=>{
      b.classList.add("disabled");
      const o=+b.dataset.o;
      if(o===correct)b.classList.add("correct");
      else if(o===oi)b.classList.add("wrong");
    });
    // 정답/오답 모두 해설 표시 (6장: 오답에 설명 제공)
    if(quiz[qi].explain){
      const ex=document.createElement("div");
      ex.className="quiz-explain";
      ex.innerHTML=`<b>${oi===correct?"✅ 정답":"💡 해설"}</b> ${esc(quiz[qi].explain)}`;
      qEl.appendChild(ex);
    }
    if(_quizAnswers.filter(a=>a!=null).length===quiz.length)showQuizResult(host,quiz);
  }));
  $("#backLearn").addEventListener("click",()=>{_quizMode=false;_learnIdx=0;renderLearn(host);});
  $("#resetQuiz").addEventListener("click",()=>{_quizAnswers=[];renderQuiz(host);});
}
function showQuizResult(host,quiz){
  const score=quiz.reduce((a,item,i)=>a+(_quizAnswers[i]===item.answer?1:0),0);
  const pass=score===quiz.length;
  $("#quizResult").innerHTML=`<div class="card pad" style="text-align:center;margin:6px 0 14px;
    border-color:${pass?"var(--ok-line)":"var(--warn-line)"};background:${pass?"var(--ok-bg)":"var(--warn-bg)"}">
    <div style="font-size:34px">${pass?"🎉":"💪"}</div>
    <h2 style="font-size:20px;margin:6px 0">${score} / ${quiz.length} 정답</h2>
    <p class="muted" style="font-size:13px">${pass?"완벽합니다! 응급상황에서 당황하지 말고 배운 대로 행동하세요.":"다시 학습하고 도전해 보세요. 반복이 생명을 구합니다."}</p>
  </div>`;
}

function expiryCell(date){
  if(!date)return `<span class="muted">미입력</span>`;
  const left=daysBetween(todayStr(),date);
  const cls=left<0?"danger":left<=getAlertDays()?"warn":"ok";
  const tag=left<0?`만료 ${-left}일`:`D-${left}`;
  return `${date}<br><span class="badge ${cls}" style="font-size:10px;padding:2px 7px">${tag}</span>`;
}

/* 좌표 유효성 검사 — 대한민국 범위 */
function validateCoords(lat,lng){
  const la=+lat,ln=+lng;
  if(isNaN(la)||isNaN(ln))return "위도·경도를 숫자로 입력하세요.";

  if(ln<124||ln>132)return "경도는 124~132 범위여야 합니다. (대한민국)";
  return null;
}

async function handleCsvUpload(e){
  const file=e.target.files&&e.target.files[0];if(!file)return;
  try{
    const text=await file.text();
    const {records}=parseCsvSimple(text);
    if(!records.length){toast("CSV에 데이터 행이 없습니다.");return;}
    const seen=Store.listDevices().slice();
    const accepted=[];let skipped=0;const errors=[];
    records.forEach((r,i)=>{
      const name=(r.name||"").trim(),address=(r.address||"").trim();
      if(!name||!address||r.lat===undefined||r.lng===undefined){skipped++;errors.push(`${i+2}행: 필수값 누락`);return;}
      const err=validateCoords(r.lat,r.lng);if(err){skipped++;errors.push(`${i+2}행: ${err}`);return;}
      const candidate={...r,name,address,lat:+r.lat,lng:+r.lng,source:"csv"};
      const dup=seen.some(x=>(normalizeSearch(x.name)===normalizeSearch(name)&&normalizeSearch(x.address)===normalizeSearch(address))||(Math.abs(Number(x.lat)-candidate.lat)<0.0001&&Math.abs(Number(x.lng)-candidate.lng)<0.0001));
      if(dup){skipped++;errors.push(`${i+2}행: 중복 기기(${name})`);return;}
      seen.push(candidate);accepted.push(candidate);
    });
    const added=Store.addDevices(accepted).length;
    closeModal();toast(`등록 ${added}건 · 건너뜀 ${skipped}건`);
    if(errors.length)console.warn("CSV 등록 경고:\n"+errors.join("\n"));
    go("devices");
  }catch(err){toast("CSV 읽기 실패: "+(err.message||err));}
}
/* 간단 CSV 파서 (따옴표 지원) */
function parseCsvSimple(text){
  text=text.replace(/^\ufeff/,"");
  const rows=[];let i=0,field="",row=[],q=false;
  const pf=()=>{row.push(field);field="";};const pr=()=>{rows.push(row);row=[];};
  while(i<text.length){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else q=false;}else field+=c;}
    else{if(c==='"')q=true;else if(c===",")pf();else if(c==="\r"){}else if(c==="\n"){pf();pr();}else field+=c;}
    i++;}
  if(field.length||row.length){pf();pr();}
  if(!rows.length)return {headers:[],records:[]};
  const headers=rows[0].map(h=>String(h).trim());
  const records=rows.slice(1).filter(r=>r.some(c=>String(c).trim()!=="")).map(r=>{
    const o={};headers.forEach((h,idx)=>o[h]=r[idx]!==undefined?String(r[idx]).trim():"");return o;});
  return {headers,records};
}

  function updatePreview(){

    go(activeMode==="admin"?activeView:"inspection");
  });

function fileToDataUrl(file){
  return new Promise((res,rej)=>{
    // 업로드 제한: 이미지 형식 + 5MB 이하 (보안/데이터 품질)
    if(file.size>5*1024*1024){rej(new Error("사진은 5MB 이하만 업로드할 수 있습니다."));return;}
    if(!/^image\//.test(file.type||"")){rej(new Error("이미지 파일만 업로드할 수 있습니다."));return;}
    const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);
  });
}

function csvCell(value){let v=String(value==null?"":value);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function downloadCsv(rows,filename){const csv=rows.map(r=>r.map(csvCell).join(",")).join("\r\n");const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}

Views.datacenter=function(host){

      <div class="head-actions"><button class="btn" id="dbRefresh">↻ 새로고침</button></div></div>

    <div class="card pad" style="margin-bottom:16px">
      <div class="card-head" style="margin-bottom:10px"><h2 style="font-size:15px">연동 상태</h2></div>

    <div class="card pad" style="margin-bottom:16px">

    </div>

    <div class="card pad">

      <ol class="prod-steps">
        <li>서버 PC에서 <code class="mono">python scripts\\sync_safemap_to_supabase.py --page-size 500</code>을 실행합니다. 같은 기기는 갱신되고 중복은 생기지 않습니다.</li>
        <li>지도에 바로 반영하려면 서버의 <code class="mono">.cache/aed_points.json</code>을 지우고 서버를 다시 시작합니다.</li>
        <li>시민 지도는 이 DB를 조회합니다. 브라우저에는 관리 등록 기기(직접 입력·CSV)만 저장됩니다.</li>

      const sido=(p.sido||[]).filter(s=>s.name!=="미상"),unknown=(p.sido||[]).filter(s=>s.name==="미상").reduce((n,s)=>n+s.count,0);

      badge.className="badge ok";badge.textContent="DB 연결됨";
      kpis.innerHTML=`
        <div class="card kpi"><div class="k-top"><span>DB 공공 AED</span></div><div class="k-val">${total.toLocaleString("ko-KR")}<small> 곳</small></div><div class="k-foot">활성 레코드 · 좌표 검증 완료</div></div>
        <div class="card kpi"><div class="k-top"><span>시도</span></div><div class="k-val">${sido.length}<small> 곳</small></div><div class="k-foot">시도 값 없음 ${unknown.toLocaleString("ko-KR")}건</div></div>
        <div class="card kpi"><div class="k-top"><span>지도 데이터 기준</span></div><div class="k-val" style="font-size:17px">${esc(generated)}</div><div class="k-foot">서버 캐시 생성 시각 (최대 6시간 유지)</div></div>`;
      table.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>시도</th><th style="text-align:right">AED</th><th style="text-align:right">비율</th></tr></thead><tbody>${sido.map(s=>`<tr><td>${esc(s.name)}</td><td style="text-align:right">${Number(s.count).toLocaleString("ko-KR")}곳</td><td style="text-align:right">${total?(s.count/total*100).toFixed(1):"0.0"}%</td></tr>`).join("")}</tbody></table></div>`;
    }catch(e){
      badge.className="badge danger";badge.textContent="DB 연결 확인 필요";kpis.innerHTML="";
      table.innerHTML=`<p class="muted" style="font-size:12px">${esc(e.message||"조회 실패")}</p>`;
    }
  }
  $("#dbRefresh").addEventListener("click",()=>{_dbPoints=null;_dbPointsPromise=null;_dbConfigured=null;load();});
  load();
};

/* ============================================================
   VIEW: 운영 설정 · 백업 (관리자 전용)
   ============================================================ */
Views.settings=function(host){
  if(!adminUnlocked){go("settings");return;}const s=Store.getSettings();
  host.innerHTML=`<div class="page-head"><div><h1>운영 설정 · 백업</h1><p>기관 표시와 사전알림 기준, 월 점검 목표를 관리합니다.</p></div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      <section class="card pad"><h2 style="font-size:16px;margin-bottom:14px">운영 설정</h2><form id="settingsForm"><div class="field"><label>기관명</label><input class="control" name="org" maxlength="100" required value="${esc(s.org)}"></div><div class="form-grid"><div class="field"><label>만료 사전알림일</label><input class="control" type="number" name="alertDays" min="1" max="365" required value="${s.alertDays}"></div><div class="field"><label>월 점검목표 (%)</label><input class="control" type="number" name="monthlyTarget" min="0" max="100" required value="${s.monthlyTarget}"></div></div><p class="muted" style="font-size:11px;margin-bottom:12px">사전알림일은 상태 판정·조치 안내·유효기간 표시에 즉시 적용됩니다.</p><button class="btn solid block" type="submit">설정 저장</button></form></section>
      <section class="card pad"><h2 style="font-size:16px;margin-bottom:14px">백업 · 복원</h2><div class="notice-box" style="margin-bottom:12px">JSON 백업에는 기기, 점검 사진, 사용/복구 기록, 작업, 설정이 포함될 수 있습니다. 안전한 장소에 보관하세요.</div><button class="btn block" id="backupExport">⬇ JSON 백업 다운로드</button><input type="file" id="backupFile" accept="application/json,.json" style="display:none"><button class="btn block" id="backupImport" style="margin-top:8px">⬆ JSON 백업 복원</button><button class="btn block" id="settingsReset" style="margin-top:8px;color:var(--danger)">모든 데이터 비우기</button></section>
    </div>
    <section class="card pad" style="margin-top:16px"><h2 style="font-size:15px;margin-bottom:10px">현재 구현 범위</h2><ul class="gi-prep" style="line-height:1.8"><li>저장소: <b>브라우저 localStorage</b> — 브라우저 데이터 삭제·다른 기기에서는 유지되지 않음</li><li>관리자 인증: <b>프런트 시연용</b> — 서버 인증·권한 검증 미연동</li><li>백업: <b>수동 JSON 파일</b> — 서버 자동 백업·복구 미연동</li><li>사용 알림: <b>로컬 기록만 저장</b> — 문자·푸시 등 실제 관리자 알림 미연동</li></ul></section>`;
  $("#settingsForm").addEventListener("submit",e=>{e.preventDefault();if(!adminUnlocked){toast("관리자 인증이 필요합니다.");return;}const f=new FormData(e.currentTarget);Store.updateSettings({org:f.get("org"),alertDays:+f.get("alertDays"),monthlyTarget:+f.get("monthlyTarget")});toast("운영 설정을 저장했습니다.");go("settings");});
  $("#backupExport").addEventListener("click",()=>{if(!adminUnlocked){toast("관리자 인증이 필요합니다.");return;}const json=JSON.stringify(Store.exportSnapshot(),null,2),blob=new Blob([json],{type:"application/json;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`AEDCare_백업_${todayStr()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("JSON 백업을 다운로드했습니다.");});
  $("#backupImport").addEventListener("click",()=>{if(!adminUnlocked){toast("관리자 인증이 필요합니다.");return;}const input=$("#backupFile");input.value="";input.onchange=async()=>{const file=input.files&&input.files[0];if(!file)return;try{const text=await file.text();if(!confirm("현재 로컬 데이터를 백업 파일 내용으로 교체할까요? 이 작업은 되돌리려면 현재 백업이 필요합니다."))return;const result=Store.importSnapshot(text);toast(`복원 완료 · 기기 ${result.devices}대 · 이벤트 ${result.events}건`);go("settings");}catch(err){toast("복원 실패: "+(err.message||err));}};input.click();});
  $("#settingsReset").addEventListener("click",()=>{if(!adminUnlocked){toast("관리자 인증이 필요합니다.");return;}if(confirm("모든 로컬 데이터를 지우고 빈 상태로 초기화할까요?")){Store.reset();toast("모든 데이터를 지우고 빈 상태로 초기화했습니다.");go("settings");}});
};

/* 데이터 저장 안내 (7장) */
function openInfoModal(){
  openModal(`
    <div class="modal-head"><h2>ⓘ 데이터 저장 안내</h2><button class="btn sm ghost" onclick="closeModal()">✕</button></div>
    <ul class="gi-prep" style="font-size:13px;line-height:1.7">
      <li>현재 버전은 <b>브라우저 로컬 저장(localStorage)</b>에 데이터를 보관하는 <b>시연용</b>입니다.</li>
      <li>브라우저 데이터 삭제, 시크릿 창, 다른 기기에서는 <b>데이터가 유지되지 않습니다.</b></li>
      <li>서버 데이터베이스·자동 백업·실제 문자/푸시 알림은 <b>미연동</b>입니다.</li>
      <li>관리자 인증은 현재 <b>프런트 데모 수준</b>이며 서버 인증·권한 검증을 대신하지 않습니다.</li>
    </ul><div style="display:flex;gap:8px;margin-top:14px"><button class="btn block" onclick="closeModal()">닫기</button>${adminUnlocked?`<button class="btn block" id="openSettings">관리자 설정·백업</button>`:""}</div>`);
  const settings=$("#openSettings");if(settings)settings.addEventListener("click",()=>{closeModal();go("settings");});
}
window.openInfoModal=openInfoModal;

/* ---------- boot ---------- */
const _ic=$("#infoChip");if(_ic)_ic.addEventListener("click",openInfoModal);
const _topExport=$("#topCsvExport");if(_topExport)_topExport.addEventListener("click",exportAllDevicesCsv);
setMode("citizen","home");
</script>
